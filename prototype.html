    const viewport = document.getElementById('app-viewport');

    const hashToScreen = {
      '#trang-chu': 'home',
      '#phong-nghi': 'rooms',
      '#dat-phong': 'booking',
      '#smart-pass': 'smartpass',
      '#blog': 'blog',
      '#lien-he': 'contact',
      '#admin': 'admin'
    };

    const screenToHash = {
      'home': '#trang-chu',
      'rooms': '#phong-nghi',
      'booking': '#dat-phong',
      'smartpass': '#smart-pass',
      'blog': '#blog',
      'contact': '#lien-he',
      'admin': '#admin'
    };

    function decodeScreen(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new TextDecoder('utf-8').decode(bytes);
    }

    function navigateTo(screenId, updateHash = true) {
      if (!screensB64[screenId]) screenId = 'home';
      
      if (updateHash && screenToHash[screenId]) {
        if (location.hash !== screenToHash[screenId]) {
          history.pushState(null, '', screenToHash[screenId]);
        }
      }

      viewport.srcdoc = decodeScreen(screensB64[screenId]);
    }

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'NAVIGATE') {
        navigateTo(event.data.screen, true);
      }
    });

    window.addEventListener('popstate', function() {
      const targetScreen = hashToScreen[location.hash] || 'home';
      navigateTo(targetScreen, false);
    });

    const initialScreen = hashToScreen[location.hash] || 'home';
    navigateTo(initialScreen, false);
  </script>
